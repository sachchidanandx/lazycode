<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="128" height="128" rx="26"/>
    </clipPath>
  </defs>

  <!-- badge background (catppuccin base) -->
  <g clip-path="url(#badgeClip)">
    <rect width="128" height="128" fill="#1e1e2e"/>
    <!-- subtle glow top-left -->
    <circle cx="18" cy="10" r="70" fill="#313244" opacity="0.55"/>
  </g>

  <!-- lazy "Zz" mark -->
  <text x="96" y="34" font-family="Menlo, monospace" font-size="20" font-weight="bold"
        fill="#a6e3a1" text-anchor="middle" transform="rotate(12 96 34)">Z</text>
  <text x="108" y="24" font-family="Menlo, monospace" font-size="12" font-weight="bold"
        fill="#a6e3a1" opacity="0.8" text-anchor="middle" transform="rotate(12 108 24)">z</text>

  <!-- vim block cursor with terminal chevron (modal editing) -->
  <g>
    <rect x="38" y="34" width="52" height="60" rx="9" fill="url(#cursor)"/>
    <path d="M 52 48 L 70 64 L 52 80" fill="none" stroke="#1e1e2e"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- leader spacebar -->
  <rect x="38" y="104" width="52" height="8" rx="4" fill="#45475a"/>
</svg>
