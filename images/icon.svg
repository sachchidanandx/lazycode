<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="nvim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc644"/>
      <stop offset="1" stop-color="#1f8ad6"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="128" height="128" rx="24"/>
    </clipPath>
  </defs>

  <!-- badge background (neovim-dark) -->
  <g clip-path="url(#badgeClip)">
    <rect width="128" height="128" fill="#17191d"/>
    <circle cx="16" cy="6" r="64" fill="#23262c" opacity="0.6"/>
  </g>

  <!-- Neovim-style N -->
  <path d="M 44 92 L 44 34 L 84 94 L 84 36"
        fill="none" stroke="url(#nvim)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- vim block cursor accent -->
  <rect x="88" y="86" width="14" height="18" rx="3" fill="#c8d3f5" opacity="0.9"/>
</svg>
