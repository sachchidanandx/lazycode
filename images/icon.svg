<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vscodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37aaf2"/>
      <stop offset="1" stop-color="#0065a9"/>
    </linearGradient>
    <linearGradient id="nvimGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fbf3f"/>
      <stop offset="1" stop-color="#2e7db2"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="128" height="128" rx="26"/>
    </clipPath>
  </defs>

  <!-- badge background (editor-dark) -->
  <g clip-path="url(#badgeClip)">
    <rect width="128" height="128" fill="#1e1e2e"/>
    <circle cx="14" cy="8" r="66" fill="#313244" opacity="0.5"/>
  </g>

  <!-- VSCode ribbon (left) -->
  <path d="M 22 34 L 50 18 L 50 110 L 22 94 L 36 64 Z"
        fill="url(#vscodeBlue)"/>

  <!-- Neovim "N" (center-right) -->
  <path d="M 64 102 L 64 28 L 98 102 L 98 28" fill="none"
        stroke="url(#nvimGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LazyVim Zzz -->
  <text x="98" y="24" font-family="Menlo, monospace" font-size="19" font-weight="bold"
        fill="#f9e2af" text-anchor="middle" transform="rotate(14 98 24)">Z</text>
  <text x="111" y="15" font-family="Menlo, monospace" font-size="11" font-weight="bold"
        fill="#f9e2af" opacity="0.85" text-anchor="middle" transform="rotate(14 111 15)">z</text>

  <!-- leader spacebar -->
  <rect x="58" y="108" width="45" height="7" rx="3.5" fill="#45475a"/>
</svg>
