<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vsBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37aaf2"/>
      <stop offset="1" stop-color="#0065a9"/>
    </linearGradient>
    <linearGradient id="nvim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc644"/>
      <stop offset="1" stop-color="#1f8ad6"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="128" height="128" rx="24"/>
    </clipPath>
  </defs>

  <!-- badge background -->
  <g clip-path="url(#badgeClip)">
    <rect width="128" height="128" fill="#17191d"/>
  </g>

  <!-- VSCode ribbon -->
  <path d="M 22 32 L 48 18 L 48 110 L 22 96 L 36 64 Z"
        fill="url(#vsBlue)"/>

  <!-- Neovim N -->
  <path d="M 70 98 L 70 30 L 104 98 L 104 30"
        fill="none" stroke="url(#nvim)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
