<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vsBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37aaf2"/>
      <stop offset="1" stop-color="#0065a9"/>
    </linearGradient>
    <linearGradient id="vimGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#019833"/>
      <stop offset="1" stop-color="#017a29"/>
    </linearGradient>
    <linearGradient id="vimBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8e8"/>
